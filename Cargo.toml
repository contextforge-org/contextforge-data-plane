[workspace]
members = [
    "crates/contextforge-data-plane",
    "crates/contextforge-data-plane-apis",
    "crates/contextforge-data-plane-cpex",
    "crates/contextforge-data-plane-lib",
    "crates/plugins/cpex-secrets-detection",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
keywords = ["mcp", "gateway", "rust", "contextforge", "a2a", "ai", "llm"]
homepage = "https://github.com/contextforge-org/contextforge-data-plane"
readme = "./README.md"
repository = "https://github.com/contextforge-org/contextforge-data-plane"



[workspace.dependencies]
# Keep dependencies here only when at least two workspace members inherit them.
contextforge-data-plane-cpex = { path = "./crates/contextforge-data-plane-cpex" }
contextforge-data-plane-apis = { path = "./crates/contextforge-data-plane-apis"}
rmcp = { version = "3.2.0", default-features = false, features = [
    "server",
    "client",
    "transport-streamable-http-server",
    "reqwest",
    "transport-streamable-http-client-reqwest",
    "elicitation",
] }
serde = {version= "1.0"}
serde_json = "1.0"
tracing = "0.1"
tracing-opentelemetry = "0.33.0"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["rt-tokio", "trace", "metrics", "internal-logs"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
http = "1.5.0"
redis = { version = "1.7.0", default-features = false, features = [
    "tokio-rustls-comp",
    "connection-manager"
] }
clap = { version = "4.6.6", features = ["derive", "env"] }
thiserror = "2.0.20"
rmp-serde = "1.3.1"
async-trait = "0.1.92"
base64 = "0.23.1"
reqwest = "0.13"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
rustls = "0.23"
cpex = "=0.2.2"
uuid = { version = "1.26.0", features = ["v4"] }
url = { version = "2.5", features = ["serde"] }
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "tokio", "tower-log", "tracing"] }
cpex-secrets-detection = { path = "./crates/plugins/cpex-secrets-detection" }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "abort"
rpath = false
strip = "debuginfo"


[profile.release-debuginfo]
debug = "full"
inherits = "release"
panic = "abort"
split-debuginfo = "packed"
strip = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
#struct_field_names = "allow"
cast_sign_loss = "allow"
clone_on_ref_ptr = "warn"
disallowed-methods = "deny"
doc_markdown = "allow"
get_unwrap = "warn"
if_then_some_else_none = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
str_to_string = "warn"
implicit_clone = "warn"
todo = "warn"
unwrap_used = "warn"
