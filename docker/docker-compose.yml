#version: "3.9"          # Supported by both podman-compose and Docker Compose v2+
name: contextforge-data-plane

networks:
  contextforge-stack-net:
    # Single user-defined bridge network keeps traffic private
    driver: bridge

volumes:
  pgdata:
    name: pgdata

###############################################################################
#  CORE SERVICE - ContextForge
###############################################################################
services:

  # ──────────────────────────────────────────────────────────────────────
  # Nginx Caching Proxy - High-performance reverse proxy with CDN-like caching
  # ──────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped

    ports:
      - "8080:80"
    networks: [contextforge-stack-net]
    dns:
      - 127.0.0.11
    command: [nginx, '-g', 'daemon off;']

    entrypoint: []
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:Z

    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost/health"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ──────────────────────────────────────────────────────────────────────
  # contextforge-data-plane
  #
  # Built with with_tools so the admin helpers (token minting, user-config
  # seeding, JWKS endpoint) are available for the seed-config sidecar.
  # ──────────────────────────────────────────────────────────────────────

  data-plane:
    labels:
      name: contextforge-data-plane
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        FEATURES: plugins,with_tools
    image: ${IMAGE_LOCAL:-contextforge-data-plane:latest}
    networks: [contextforge-stack-net]

    environment:
      - CONTEXTFORGE_DATA_PLANE_ADDRESS=0.0.0.0:4445
      - CONTEXTFORGE_DATA_PLANE_REDIS_HOSTNAME=redis
      - CONTEXTFORGE_DATA_PLANE_REDIS_PORT=6379
      - CONTEXTFORGE_DATA_PLANE_REDIS_CONNECTION_MODE=plain-text
      - CONTEXTFORGE_DATA_PLANE_UPSTREAM_CONNECTION_MODE=plain-text-or-tls
      - CONTEXTFORGE_DATA_PLANE_JWKS_URL=http://localhost:4445/contextforge-rs/admin/.well-known/jwks.json
      - RUST_LOG=debug

    command:
      - "--token-verification-private-key"
      - "/keys/jwt.key"

    volumes:
      - ../assets/jwt.key:/keys/jwt.key:ro

    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      # Health is available in production builds without with_tools.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; import json; resp =
            urllib.request.urlopen('http://localhost:4445/contextforge-rs/health',
            timeout=5); data = json.loads(resp.read());
            print(data.get('status') == 'healthy'); exit(0 if data.get('status')
            == 'healthy' else 1)",
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      mode: replicated
      replicas: ${GATEWAY_REPLICAS:-3}
      resources:
        limits:
          cpus: '${GATEWAY_CPU_LIMIT:-2}'
          memory: ${GATEWAY_MEM_LIMIT:-2G}
        reservations:
          cpus: '${GATEWAY_CPU_RESERVATION:-1}'
          memory: ${GATEWAY_MEM_RESERVATION:-512M}

  contextforge-data-plane-one:
    image: ${IMAGE_LOCAL:-contextforge-data-plane:latest}
    container_name: contextforge-data-plane-one
    networks: [contextforge-stack-net]
    ports: [5551:4445]

    environment:
      - CONTEXTFORGE_DATA_PLANE_ADDRESS=0.0.0.0:4445
      - CONTEXTFORGE_DATA_PLANE_REDIS_HOSTNAME=redis
      - CONTEXTFORGE_DATA_PLANE_REDIS_PORT=6379
      - CONTEXTFORGE_DATA_PLANE_REDIS_CONNECTION_MODE=plain-text
      - CONTEXTFORGE_DATA_PLANE_UPSTREAM_CONNECTION_MODE=plain-text-or-tls
      - CONTEXTFORGE_DATA_PLANE_JWKS_URL=http://localhost:4445/contextforge-rs/admin/.well-known/jwks.json
      - RUST_LOG=debug

    command:
      - "--token-verification-private-key"
      - "/keys/jwt.key"

    volumes:
      - ../assets/jwt.key:/keys/jwt.key:ro

    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          cpus: '${GATEWAY_CPU_LIMIT:-2}'
          memory: ${GATEWAY_MEM_LIMIT:-2G}
        reservations:
          cpus: '${GATEWAY_CPU_RESERVATION:-1}'
          memory: ${GATEWAY_MEM_RESERVATION:-512M}

  contextforge-data-plane-two:
    image: ${IMAGE_LOCAL:-contextforge-data-plane:latest}
    container_name: contextforge-data-plane-two
    networks: [contextforge-stack-net]
    ports: [5552:4445]

    environment:
      - CONTEXTFORGE_DATA_PLANE_ADDRESS=0.0.0.0:4445
      - CONTEXTFORGE_DATA_PLANE_REDIS_HOSTNAME=redis
      - CONTEXTFORGE_DATA_PLANE_REDIS_PORT=6379
      - CONTEXTFORGE_DATA_PLANE_REDIS_CONNECTION_MODE=plain-text
      - CONTEXTFORGE_DATA_PLANE_UPSTREAM_CONNECTION_MODE=plain-text-or-tls
      - CONTEXTFORGE_DATA_PLANE_JWKS_URL=http://localhost:4445/contextforge-rs/admin/.well-known/jwks.json
      - RUST_LOG=debug

    command:
      - "--token-verification-private-key"
      - "/keys/jwt.key"

    volumes:
      - ../assets/jwt.key:/keys/jwt.key:ro

    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          cpus: '${GATEWAY_CPU_LIMIT:-2}'
          memory: ${GATEWAY_MEM_LIMIT:-2G}
        reservations:
          cpus: '${GATEWAY_CPU_RESERVATION:-1}'
          memory: ${GATEWAY_MEM_RESERVATION:-512M}

  mcp-counter-tool-one:
    image: ghcr.io/mcp-counter-tool:latest
    container_name: mcp-counter-tool-one
    networks: [contextforge-stack-net]
    ports: [5601:5555]

    environment:
      - RUST_LOG=debug

    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          cpus: '${GATEWAY_CPU_LIMIT:-2}'
          memory: ${GATEWAY_MEM_LIMIT:-2G}
        reservations:
          cpus: '${GATEWAY_CPU_RESERVATION:-1}'
          memory: ${GATEWAY_MEM_RESERVATION:-512M}

  mcp-counter-tool-two:
    image: ghcr.io/mcp-counter-tool:latest
    container_name: mcp-counter-tool-two
    networks: [contextforge-stack-net]
    ports: [5602:5555]

    environment:
      - RUST_LOG=debug

    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          cpus: '${GATEWAY_CPU_LIMIT:-2}'
          memory: ${GATEWAY_MEM_LIMIT:-2G}
        reservations:
          cpus: '${GATEWAY_CPU_RESERVATION:-1}'
          memory: ${GATEWAY_MEM_RESERVATION:-512M}

  ###############################################################################
  #  CACHE
  ###############################################################################
  redis:
    image: redis:latest
    container_name: redis
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Performance tuning for 1000+ RPS high-concurrency load testing
    command:
      - "redis-server"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--tcp-backlog"
      - "2048"
      - "--timeout"
      - "0"
      - "--tcp-keepalive"
      - "300"
      - "--maxclients"
      - "10000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "6379:6379" # expose only if you want host access
    networks: [contextforge-stack-net]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  ###############################################################################
  #  DATABASE - control plane storage (kept for external control-plane use)
  ###############################################################################
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    shm_size: 256m  # Increase from 64MB default to prevent shared memory exhaustion under load
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
      nproc:
        soft: 5000
        hard: 5000
    ports:
      - "5433:5432"      # Expose for local inspection (5433 to avoid conflict with local postgres)
    command:
      - "postgres"
      - "-c"
      - "max_connections=800"     # Must exceed PgBouncer MAX_DB_CONNECTIONS (700) + overhead
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "idle_in_transaction_session_timeout=300s"  # Safety net; app closes transactions on commit
      - "-c"
      - "statement_timeout=120s"
      - "-c"
      - "synchronous_commit=off"    # Async WAL writes (2-10x faster commits)
      - "-c"
      - "commit_delay=100"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mysecretpassword}
      - POSTGRES_DB=mcp
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [contextforge-stack-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    networks: [contextforge-stack-net]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 5000
        hard: 5000
    ports:
      - "6432:6432"    # PgBouncer port (optional external access)
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/mcp
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=600
      - MIN_POOL_SIZE=100
      - RESERVE_POOL_SIZE=150
      - RESERVE_POOL_TIMEOUT=2
      - MAX_DB_CONNECTIONS=700         # Must be < postgres max_connections
      - MAX_USER_CONNECTIONS=700
      - SERVER_LIFETIME=3600
      - SERVER_IDLE_TIMEOUT=600
      - QUERY_WAIT_TIMEOUT=60
      - CLIENT_IDLE_TIMEOUT=120
      - SERVER_CONNECT_TIMEOUT=5
      - SERVER_RESET_QUERY=DISCARD ALL
      - SERVER_RESET_QUERY_ALWAYS=1
      - IDLE_TRANSACTION_TIMEOUT=30
      - AUTH_TYPE=scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  ###############################################################################
  # TEST MCP SERVER - Fast Time Server
  ###############################################################################
  fast_time_server:
    image: ghcr.io/ibm/cfex-mcp-fast-time-server:latest
    container_name: fast_time_server
    restart: unless-stopped
    networks: [contextforge-stack-net]
    ports:
      - "8880:8880"
    environment:
      - BIND_ADDRESS=0.0.0.0:8880
      - RUST_LOG=info
    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
      - net.core.somaxconn=65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 5000
        hard: 5000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8880/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  ###############################################################################
  # SEED CONFIG - Register Fast Time Server via data-plane admin API
  #
  # One-shot container that discovers tools from fast_time_server and seeds
  # a UserConfig into Redis through the data-plane's /admin/userconfigs
  # endpoint. The data-plane reads this config from Redis at request time.
  ###############################################################################
  seed-config:
    image: alpine:latest
    container_name: seed-config
    networks: [contextforge-stack-net]
    depends_on:
      data-plane:
        condition: service_healthy
      fast_time_server:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl jq > /dev/null 2>&1

        DATAPLANE=http://data-plane:4445/contextforge-rs
        BACKEND_URL=http://fast_time_server:8880/mcp
        USER_ID=11111111-1111-1111-1111-111111111111
        VIRTUAL_HOST_ID=b8e3f1a2c4d5e6f7a1b2c3d4e5f6a7b8
        BACKEND_NAME=fast-time

        MCP_META='{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"seed","version":"0.1.0"},"io.modelcontextprotocol/clientCapabilities":{}}'

        # Parse a response that may arrive as direct JSON or SSE.
        parse_mcp_response() {
          local raw="$$1"
          if printf '%s' "$$raw" | grep -q '^data:'; then
            printf '%s' "$$raw" | grep '^data:' | head -1 | sed 's/^data: *//'
          else
            printf '%s' "$$raw"
          fi
        }

        echo "Discovering tools from fast_time_server..."
        RAW=$$(curl -sf "$$BACKEND_URL" \
          -H 'content-type: application/json' \
          -H 'accept: application/json, text/event-stream' \
          -H 'mcp-protocol-version: 2026-07-28' \
          -H 'mcp-method: server/discover' \
          -H 'mcp-name: seed' \
          -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"server/discover\",\"params\":{\"_meta\":$$MCP_META}}")
        DISCOVER=$$(parse_mcp_response "$$RAW")
        echo "Discover: $$(echo "$$DISCOVER" | jq -c '.result.serverInfo // .result')"

        RAW=$$(curl -sf "$$BACKEND_URL" \
          -H 'content-type: application/json' \
          -H 'accept: application/json, text/event-stream' \
          -H 'mcp-protocol-version: 2026-07-28' \
          -H 'mcp-method: tools/list' \
          -H 'mcp-name: seed' \
          -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\",\"params\":{\"_meta\":$$MCP_META}}")
        TOOLS_RESPONSE=$$(parse_mcp_response "$$RAW")

        TOOL_NAMES=$$(echo "$$TOOLS_RESPONSE" | jq -r '.result.tools[].name // empty')
        echo "Tools found: $$TOOL_NAMES"

        # Build the tools routing map: each tool prefixed with backend name.
        TOOLS_JSON=$$(echo "$$TOOLS_RESPONSE" | jq -c \
          --arg bn "$$BACKEND_NAME" \
          '[.result.tools[].name] | reduce .[] as $$n ({}; . + {($$bn + "-" + $$n): {backend_name: $$bn, upstream_name: $$n}})')

        CONFIG=$$(jq -n \
          --arg vhid "$$VIRTUAL_HOST_ID" \
          --arg bn "$$BACKEND_NAME" \
          --arg url "$$BACKEND_URL" \
          --argjson tools "$$TOOLS_JSON" \
          '{virtual_hosts: {($$vhid): {backends: {($$bn): {name: $$bn, url: $$url, mcp_protocol_version: "2026-07-28", passthrough_headers: []}}, tools: $$tools}}}')

        echo "Seeding user config for $$USER_ID..."
        HTTP_CODE=$$(curl -sf -w '%{http_code}' -o /tmp/seed_response \
          -X POST "$$DATAPLANE/admin/userconfigs/$$USER_ID" \
          -H 'content-type: application/json' \
          -d "$$CONFIG")

        echo "Seed response: HTTP $$HTTP_CODE — $$(cat /tmp/seed_response)"
        echo "Virtual host: $$VIRTUAL_HOST_ID"
        echo "Tools registered: $$(echo "$$TOOLS_JSON" | jq -r 'keys[]')"
        echo ""
        echo "Mint a token from the host:"
        echo "  curl http://localhost:8080/contextforge-rs/admin/tokens/team_awesome/$$USER_ID?email=admin@example.com"
