#version: "3.9"          # Supported by both podman-compose and Docker Compose v2+
name: contextforge-data-plane

networks:
  contextforge-stack-net:
    # Single user-defined bridge network keeps traffic private
    driver: bridge

volumes:
  pgdata:
    name: pgdata

###############################################################################
#  CORE SERVICE - ContextForge
###############################################################################
services:

  # ──────────────────────────────────────────────────────────────────────
  # Nginx Caching Proxy - High-performance reverse proxy with CDN-like caching
  # ──────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped

    ports:
      - "8080:80"
    networks: [contextforge-stack-net]
    dns:
      - 127.0.0.11
    command: [nginx, '-g', 'daemon off;']

    entrypoint: []
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:Z
      - ../assets/jwks.json:/etc/nginx/jwks.json:ro

    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 2G

  # ──────────────────────────────────────────────────────────────────────
  # gateway (contextforge-data-plane)
  # ──────────────────────────────────────────────────────────────────────

  gateway:
    labels:
      name: contextforge-data-plane
    image: ${IMAGE_LOCAL:-contextforge-data-plane:latest}
    volumes:
      - ../assets/jwks.json:/jwks.json:ro
    networks: [contextforge-stack-net]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        python3 -m http.server 9999 --directory / &
        exec /contextforge-data-plane

    environment:
      - CONTEXTFORGE_DATA_PLANE_ADDRESS=0.0.0.0:4445
      - CONTEXTFORGE_DATA_PLANE_REDIS_HOSTNAME=redis
      - CONTEXTFORGE_DATA_PLANE_REDIS_PORT=6379
      - CONTEXTFORGE_DATA_PLANE_REDIS_CONNECTION_MODE=plain-text
      - CONTEXTFORGE_DATA_PLANE_UPSTREAM_CONNECTION_MODE=plain-text-or-tls
      # Tiny Python HTTP server inside the container serves /jwks.json on
      # localhost:9999 so the data-plane's HTTPS-or-loopback JWKS guard passes.
      - CONTEXTFORGE_DATA_PLANE_JWKS_URL=http://localhost:9999/jwks.json
      - RUST_LOG=debug

    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      redis:
        condition: service_healthy
      register_fast_time:
        condition: service_completed_successfully

    healthcheck:
      # Health is available in production builds without with_tools.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; import json; resp =
            urllib.request.urlopen('http://localhost:4445/contextforge-rs/health',
            timeout=5); data = json.loads(resp.read());
            print(data.get('status') == 'healthy'); exit(0 if data.get('status')
            == 'healthy' else 1)",
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '4'
          memory: 4G

  ###############################################################################
  #  DATABASE
  ###############################################################################
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    shm_size: 256m  # Increase from 64MB default to prevent shared memory exhaustion under load
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
      nproc:
        soft: 5000
        hard: 5000
    ports:
      - "5433:5432"      # Expose for local inspection (5433 to avoid conflict with local postgres)
    command:
      - "postgres"
      - "-c"
      - "max_connections=800"     # Must exceed PgBouncer MAX_DB_CONNECTIONS (700) + overhead
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "idle_in_transaction_session_timeout=300s"  # Safety net; app closes transactions on commit
      - "-c"
      - "statement_timeout=120s"
      - "-c"
      - "synchronous_commit=off"    # Async WAL writes (2-10x faster commits)
      - "-c"
      - "commit_delay=100"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mysecretpassword}
      - POSTGRES_DB=mcp
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [contextforge-stack-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 2G

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    networks: [contextforge-stack-net]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 5000
        hard: 5000
    ports:
      - "6432:6432"    # PgBouncer port (optional external access)
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/mcp
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=600
      - MIN_POOL_SIZE=100
      - RESERVE_POOL_SIZE=150
      - RESERVE_POOL_TIMEOUT=2
      - MAX_DB_CONNECTIONS=700         # Must be < postgres max_connections
      - MAX_USER_CONNECTIONS=700
      - SERVER_LIFETIME=3600
      - SERVER_IDLE_TIMEOUT=600
      - QUERY_WAIT_TIMEOUT=60
      - CLIENT_IDLE_TIMEOUT=120
      - SERVER_CONNECT_TIMEOUT=5
      - SERVER_RESET_QUERY=DISCARD ALL
      - SERVER_RESET_QUERY_ALWAYS=1
      - IDLE_TRANSACTION_TIMEOUT=30
      - AUTH_TYPE=scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 2G

  ###############################################################################
  #  MIGRATION - one-shot Alembic upgrade + bootstrap
  ###############################################################################
  migration:
    # One-shot init container: runs alembic upgrade head + bootstrap before any gateway replica starts.
    # Uses Postgres directly (port 5432) — advisory locks are session-scoped, must bypass PgBouncer.
    image: ghcr.io/ibm/mcp-context-forge:d24df05e7985787bfa3264ab45cee411e308a111
    container_name: migration
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/mcp
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-devsecret-change-me}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-changeme}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - AUTH_ENCRYPTION_SECRET=${AUTH_ENCRYPTION_SECRET:-devencryption-change-me}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MCPGATEWAY_SKIP_MIGRATIONS=false
    command: ["python", "-m", "mcpgateway.bootstrap_db"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [contextforge-stack-net]
    restart: "no"

  ###############################################################################
  #  CONTROL PLANE - ContextForge (Python) - config, policy and identity owner
  ###############################################################################
  control-plane:
    labels:
      name: controlplane
    image: ghcr.io/ibm/mcp-context-forge:d24df05e7985787bfa3264ab45cee411e308a111
    container_name: control-plane
    restart: unless-stopped
    networks: [contextforge-stack-net]
    ports:
      - "4444:4444"
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-mysecretpassword}@pgbouncer:6432/mcp
      - DB_PREPARE_THRESHOLD=0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-devsecret-change-me}
      - JWT_ALGORITHM=RS256
      - JWT_PUBLIC_KEY_PATH=/keys/jwt.key.pub
      - JWT_PRIVATE_KEY_PATH=/keys/jwt.key
      - AUTH_ENCRYPTION_SECRET=${AUTH_ENCRYPTION_SECRET:-devencryption-change-me}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-changeme}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MCPGATEWAY_SKIP_MIGRATIONS=true
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - MCPGATEWAY_UI_ENABLED=true
      - MCPGATEWAY_ADMIN_API_ENABLED=true
      - SSRF_ALLOW_PRIVATE_NETWORKS=true
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TYPE=redis
      - DATAPLANE_PUBLISHER=true
    volumes:
      - ../assets/:/keys:z
    depends_on:
      migration:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  ###############################################################################
  #  CACHE
  ###############################################################################
  redis:
    image: redis:latest
    container_name: redis
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Performance tuning for 1000+ RPS high-concurrency load testing
    command:
      - "redis-server"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--tcp-backlog"
      - "2048"
      - "--timeout"
      - "0"
      - "--tcp-keepalive"
      - "300"
      - "--maxclients"
      - "10000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "6379:6379" # expose only if you want host access
    networks: [contextforge-stack-net]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 2G

  ###############################################################################
  # TEST MCP SERVER - Fast Time Server
  ###############################################################################
  fast_time_server:
    image: ghcr.io/ibm/cfex-mcp-fast-time-server:latest
    container_name: fast_time_server
    restart: unless-stopped
    networks: [contextforge-stack-net]
    ports:
      - "8880:8880"
    environment:
      - BIND_ADDRESS=0.0.0.0:8880
      - RUST_LOG=info
    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
      - net.core.somaxconn=65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 5000
        hard: 5000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8880/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 2G
  # AUTO-REGISTRATION - Publish Fast Time Server routes directly to dataplane Redis
  ###############################################################################
  register_fast_time:
    image: ${CF_HELPERS_IMAGE:-ghcr.io/contextforge-org/cf-integration-helpers:${CF_HARNESS_VERSION:-0.4.0}}
    pull_policy: ${CF_HARNESS_PULL_POLICY:-missing}
    container_name: register_fast_time
    networks: [contextforge-stack-net]
    depends_on:
      redis:
        condition: service_healthy
      fast_time_server:
        condition: service_healthy
    environment:
      CF_CONFIG_REDIS_URL: redis://redis:6379
      CF_FAST_TIME_SERVER_ID: ${CF_FAST_TIME_SERVER_ID:-b8e3f1a2c4d5e6f7a1b2c3d4e5f6a7b8}
      CF_FAST_TIME_BACKEND_URL: ${CF_FAST_TIME_BACKEND_URL:-http://fast_time_server:8880/mcp}
      CF_FAST_TIME_PROTOCOL_VERSION: "2026-07-28"
      MCP_CONFORMANCE_TOKEN: ${MCP_CONFORMANCE_TOKEN:-}
    volumes:
      - ../assets/jwt.key:/keys/jwt.key:ro
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${MCP_CONFORMANCE_TOKEN:-}" ]; then
          export MCP_CONFORMANCE_TOKEN="$$(cf-integration __helper token default admin@example.com)"
        fi
        exec cf-integration __helper fixture \
          "$${CF_FAST_TIME_SERVER_ID}" \
          "$${CF_FAST_TIME_BACKEND_URL}" \
          "$${CF_FAST_TIME_PROTOCOL_VERSION}"
